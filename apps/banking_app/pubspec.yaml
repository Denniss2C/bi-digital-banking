name: banking_app
description: Banco Internacional digital banking app shell (composition, routing, global DI).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  core: ^0.0.1
  design_system: ^0.0.1
  sdui: ^0.0.1
  auth: ^0.0.1
  accounts: ^0.0.1
  notifications: ^0.0.1
  fx_rates: ^0.0.1
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  injectable: ^3.0.0
  go_router: ^18.0.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  firebase_remote_config: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  build_runner: ^2.15.1
  injectable_generator: ^3.1.3
  fpdart: ^1.2.0

flutter:
  uses-material-design: true
  # Generates lib/l10n/gen from the ARB files (see l10n.yaml).
  generate: true
  # `flutter run` without --flavor uses dev (see lib/main.dart).
  default-flavor: dev
