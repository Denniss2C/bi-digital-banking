name: design_system
description: Design tokens, light/dark themes and accessible UI components.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  equatable: ^2.0.7
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Inter (SIL OFL 1.1, rsms/inter v4.1) is bundled so text renders offline.
  # Use it with `package: 'design_system'`; AppTheme already does.
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
  assets:
    - fonts/OFL.txt
