name: accounts
description: Accounts feature - balances, movements and transfers.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  core: ^0.0.1
  design_system: ^0.0.1
  sdui: ^0.0.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  fpdart: ^1.2.0
  cloud_firestore: ^6.10.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  fake_cloud_firestore: ^4.3.0

flutter:
  # Generates lib/l10n/gen from the ARB files (see l10n.yaml).
  generate: true
